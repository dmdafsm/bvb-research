[project]
name = "bvb"
version = "0.1.0"
description = "Personal research tool for Bucharest Stock Exchange (BVB) companies"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "pandas>=3.1.0",
    "playwright>=1.64.1",
    "plotly>=7.1.0",
    "pypdf>=6.21.2",
    "selectolax>=1.0.2",
    "streamlit>=1.66.1",
    "typer>=0.27.3",
]

[project.scripts]
bvb = "bvb.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, ruff-specific
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Romanian text uses typographic characters on purpose
]

[tool.ruff.lint.per-file-ignores]
"scripts/tests/*" = ["E402"]  # sys.path insertion before importing the scripts under test
"tests/test_reports.py" = ["E501"]  # inline HTML/RSS samples copied from the sources

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
